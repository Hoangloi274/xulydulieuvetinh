[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-nowcast"
version = "0.2.0"
description = "Lightning nowcasting for southern Vietnam from radar, Himawari and lightning data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.61",
    "matplotlib>=3.10.8",
    "numcodecs>=0.13.1",
    "numpy>=2.2.6",
    "pandas",
    "pyresample",
    "pyshp",
    "satpy>=0.59.0",
    "tqdm>=4.67.3",
    "xarray>=2025.6.1",
    "xradar>=0.11.1,<0.13",  # 0.13 masks no-echo gates as NaN and moves each ray one azimuth step: inputs unlike training
    "zarr>=2.18.3",
]

[project.optional-dependencies]
# torch: pick one build per machine, e.g. `uv sync --extra cpu` (laptop, live daemon) or `--extra cu118` (training server)
cpu = ["torch>=2.7"]
cu118 = ["torch>=2.7; python_version < '3.14'"]  # training server (NVIDIA driver 525); the cu118 builds end at torch 2.7.1
# the operator app (python -m lightning_nowcast.app)
gui = ["PySide6-Essentials>=6.8"]
# the archived v2 system and plotting tools (archive/)
legacy = ["cartopy>=0.25.0", "geopandas>=1.1.3", "iris>=1.0.7", "s3fs>=2026.2.0", "scipy>=1.15.3", "shapely>=2.1.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu118" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
